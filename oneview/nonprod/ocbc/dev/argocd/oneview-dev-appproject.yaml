apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ocbc-dev
  namespace: argocd
spec:
  description: OCBC DEV environment only
  
  sourceRepos:
  - https://github.com/CodeByMurali/CDUsingArgoCD.git
  - https://github.com/CodeByMurali/gitops-demo.git
  
  destinations:
  - namespace: 'dev'
    name: spoke2.us-east-1.eksctl.io
  
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
