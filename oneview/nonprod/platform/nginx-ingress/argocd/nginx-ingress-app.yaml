apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress-oneview-nonprod
  namespace: argocd
  labels:
    deployment-model: oneview
    realm: nonprod
    service: nginx-ingress
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.8.3
    helm:
      releaseName: nginx-ingress
      values: |
        controller:
          replicaCount: 2
          service:
            type: LoadBalancer
  destination:
    name: spoke2.us-east-1.eksctl.io
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
