apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kynex-prod-bootstrap
  namespace: argocd
  labels:
    deployment-model: kynex
    realm: prod
    bootstrap: "true"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/CodeByMurali/gitops-demo.git
      revision: scalable
      directories:
      - path: kynex/prod/preprod/argocd #points to preprod appset
      - path: kynex/prod/prod/argocd #points to prod appset
  template:
    metadata:
      name: 'bootstrap-{{index .path.segments 0}}-{{index .path.segments 1}}-{{index .path.segments 2}}'
      labels:
        deployment-model: kynex
        realm: prod
        bootstrap: "true"
    spec:
      project: default
      source:
        repoURL: https://github.com/CodeByMurali/gitops-demo.git
        targetRevision: scalable
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
