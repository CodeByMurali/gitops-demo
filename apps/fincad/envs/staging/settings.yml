---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fincad-deployment
spec:
  template:
    spec:
      containers:
      - name: fincad
        env:
        - name: UI_THEME
          value: "light"
        - name: CACHE_SIZE
          value: "1024kb"
        - name: PAGE_LIMIT
          value: "25"
        - name: SORTING
          value: "ascending"    
        - name: N_BUCKETS
          value: "24"          