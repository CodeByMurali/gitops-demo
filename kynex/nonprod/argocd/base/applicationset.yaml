apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet # Manifest type
metadata:
  name: PLACEHOLDER_NAME
  namespace: argocd
  labels:
    deployment-model: kynex
    realm: nonprod
    environment: PLACEHOLDER_ENVIRONMENT
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/CodeByMurali/CDUsingArgoCD.git
      revision: scalable
      directories:
      - path: argocd/apps/*/envs/PLACEHOLDER_ENVIRONMENT
  template:
    metadata:
      name: 'kynex-{{index .path.segments 2}}-PLACEHOLDER_ENVIRONMENT' # kynex-trade-dev
      labels:
        realm: nonprod
        environment: PLACEHOLDER_ENVIRONMENT
        service: '{{index .path.segments 2}}'
    spec:
      project: PLACEHOLDER_PROJECT
      source:
        repoURL: https://github.com/CodeByMurali/CDUsingArgoCD.git
        targetRevision: scalable # refers to branch name in application repo
        path: '{{.path.path}}'  # refers to folder structure in application repo
      destination:
        name: PLACEHOLDER_CLUSTER # refers to EKS cluster name
        namespace: PLACEHOLDER_NAMESPACE # refers to namespace in the cluster
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
