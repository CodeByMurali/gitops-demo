apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kynex-preprod
  namespace: argocd
spec:
  description: Kynex PREPROD environment only
  
  sourceRepos:
  - https://github.com/CodeByMurali/CDUsingArgoCD.git
  - https://github.com/CodeByMurali/gitops-demo.git
  
  destinations:
  - namespace: 'preprod'
    name: spoke1.us-east-1.eksctl.io
  
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
