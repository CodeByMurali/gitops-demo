apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prod-account
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/CodeByMurali/gitops-demo.git
      revision: HEAD
      directories:
      - path: apps/*/envs/prod      
  template:      
    metadata:
      # This defines the template section of an ArgoCD ApplicationSet
      # The metadata.name uses Go templating to dynamically generate application names
      # It extracts the 2nd segment (index 1) and 4th segment (index 3) from the directory path
      # For example, if path is "apps/myapp/envs/prod-us", the name becomes "myapp-prod-us"
      name: '{{index .path.segments 1}}-{{index .path.segments 3}}' 
    spec:
      # The project the application belongs to.
      project: default

      # Source of the application manifests
      source:
        repoURL: https://github.com/CodeByMurali/gitops-demo.git
        targetRevision: HEAD
        path: '{{.path.path}}'
        kustomize:
          buildOptions: --enable-helm
      
      # Destination cluster and namespace to deploy the application
      destination:
        name: spoke1.us-east-1.eksctl.io
        namespace: '{{index .path.segments 1}}-{{index .path.segments 3}}'

      # Sync policy
      syncPolicy:
        syncOptions:
          - CreateNamespace=true  
        automated: # automated sync by default retries failed attempts 5 times with following delays between attempts ( 5s, 10s, 20s, 40s, 80s ); retry controlled using `retry` field.
          prune: true # Specifies if resources should be pruned during auto-syncing ( false by default ).
          selfHeal: true # Specifies if partial app sync should be executed when resources are changed only in target Kubernetes cluster and no git change detected ( false by default ).
      
