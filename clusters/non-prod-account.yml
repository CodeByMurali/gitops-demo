apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: non-prod-account
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/CodeByMurali/gitops-demo.git
      revision: HEAD
      directories:
      - path: apps/*/envs/dev
      - path: apps/*/envs/qa
      - path: apps/*/envs/stage
  template:      
    metadata:
      name: '{{index .path.segments 1}}-{{index .path.segments 3}}'     
    spec:
      project: default
      source:
        repoURL: https://github.com/CodeByMurali/gitops-demo.git
        targetRevision: HEAD
        path: '{{.path.path}}'
        kustomize:
          enableHelm: true
      destination:
        name: spoke2.us-east-1.eksctl.io
        namespace: '{{index .path.segments 1}}-{{index .path.segments 3}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true  
        automated:
          prune: true
          selfHeal: true
